[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vida-ao-grafico"
version = "0.1.0"
description = "Dialeto do mercado descoberto a partir dos dados: alfabeto (VQ-VAE), palavras (BPE), modelo de linguagem e validação walk-forward."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
    "pyyaml>=6",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
