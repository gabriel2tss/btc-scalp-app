# Critérios de sucesso — seção 8 do briefing.
#
# Preenchidos em 30/09/2026 com o Gabriel, ANTES de rodar o modelo de barreiras (triplo limite)
# e antes de ver qualquer resultado dele. Travados com `python -m vag.criteria lock`.
# Se os critérios não forem atingidos, esta linha encerra ou pivota — sem ajustar os critérios depois.
#
# Estratégia avaliada: GBM treinado para o resultado das barreiras (take/stop proporcionais à
# volatilidade, horizonte máximo 1 h ou 4 h, escolhidos só na validação), com semáforo de validação,
# execução realista com ordens limitadas simulada negócio a negócio (ticks) e funding real.
# Duas variantes julgadas separadamente: só números e números + dialeto.

assets: [BTCUSDT_UM]                 # futuro perpétuo USDT-M da Binance
horizons_minutes: [60, 240]          # tempo máximo de cada operação (barreira de tempo)
min_net_edge_per_trade: 0.10         # média líquida por operação, custos realistas, todas as operações de teste juntas
min_net_edge_unit: pct
min_hit_rate_oos: null
min_profit_factor_oos: 1.20          # todas as operações de teste juntas
min_walkforward_windows_passing: 7   # janela "passa" = operou e terminou com média líquida > 0 e PF >= 1,0
total_walkforward_windows: 11
min_phrase_occurrences: 300          # frases do dicionário (variante com dialeto)
fdr_q: 0.05
min_pooled_t_stat: 2.0               # todas as operações de teste juntas
cost_stress:
  multiplier: 1.5                    # taxas, derrapagem e funding x1,5
  min_net_edge_per_trade: 0.05       # ainda >= 0,05% por operação
costs:
  spread: ticks_measured             # execução simulada negócio a negócio com os ticks da Binance
  maker_fee_pct: 0.02
  taker_fee_pct: 0.05
  slippage_pct: 0.01                 # ordens a mercado: stop, saída por tempo, entrada que cruza o livro
  funding: binance_historical
  slippage_points: null
  commission_per_lot: null
evaluation:
  execution: >-
    entrada limitada 1 tick melhor que o último preço por até 1 min (executa só se um negócio real passar do
    preço; se executar no 1º segundo, paga taxa taker); take = ordem limitada; stop e saída por tempo = a mercado
  barreiras: >-
    take = a x volatilidade esperada no horizonte (a em 1, 1,5, 2), mínimo de 3x os custos; take:stop 1:1 ou 2:1;
    horizonte 60 ou 240 min; toque simultâneo no mesmo minuto conta como stop
  semaforo: opera a janela só se, na validação, média líquida >= +5 bps e PF >= 1,15
  veredito: cada variante passa só se TODOS os critérios acima forem atingidos
